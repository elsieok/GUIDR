[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guidr"
version = "0.1.0"
description = "CRISPR guide design with genome-wide off-target search (M1: brute-force oracle)"
requires-python = ">=3.10"
dependencies = []
api = ["fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
guidr = "guidr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
