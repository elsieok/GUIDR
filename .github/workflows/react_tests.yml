name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guidr_ts/viewer/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./guidr_ts/viewer

      - name: Run Linter
        run: npm run lint
        working-directory: ./guidr_ts/viewer

      - name: Run Unit Tests
        run: npm test
        working-directory: ./guidr_ts/viewer
